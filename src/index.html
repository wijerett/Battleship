<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:;base64,iVBORwOKGgo">
    <title>404</title>
</head>
<body>
    <div class="title">
        <h2 class="instructions">To begin game, first enter coordinates for the placement of each ship</h2>
    </div>
    <div class="topContainer">
        <div id="top">
            <button id="reset" class="reset">Reset Board</button>
            
            <input class="rowBox" id="rowBox" type="number">row</input>
            <input class="colBox" id="colBox" type="number">col</input>
            <select id="directionBox">
                <option value="horizontal">Horizontal</option>
                <option value="vertical">Vertical</option>
            </select>
            <button id="submitBtn" type="submit">submit</button>
        </div>
    </div>

    <div id="playGamePrompt" class="modal-overlay hidden">
        <div class="modal-box">
            <p>All ships placed!</p>
            <button id="playGameBtn">Begin Game!</button>
        </div>
    </div>

    <div id="gameOverModal" class="Modal-overlay hidden">
        <div class="overlay-box">
            <p id="gameOverPopup"></p>
        </div>
    </div>


    <div class="boardBox">

        <div class="board-container">
            <h3>Player 1 Board</h3>
            <div id="board1" class="board-grid"></div>
        </div>
        
        <div class="board-container">
            <h3>Player 2 Board</h3>
            <div id="board2" class="board-grid"></div>
        </div>



    </div>
</body>
</html>
